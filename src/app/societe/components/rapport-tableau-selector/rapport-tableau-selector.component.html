<section class="selector-page">
  <h2>Rapport Tableau</h2>
  <p>Choisissez un rapport (previsionnel de l'annee en cours par defaut), puis cliquez sur Ouvrir.</p>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  <p *ngIf="loading">Chargement...</p>

  <div *ngIf="!loading" class="selector-box">
    <label for="rapport-tableau-select">Rapport</label>
    <select id="rapport-tableau-select" [(ngModel)]="selectedRapportId">
      <option [ngValue]="null">Choisir un rapport</option>
      <option *ngFor="let r of rapports" [ngValue]="r.id">
        {{ getTypeLabel(r.type) }} - {{ r.annee }}
      </option>
    </select>

    <button type="button" (click)="openTableau()" [disabled]="!selectedRapportId">Ouvrir Tableau</button>
  </div>
</section>
