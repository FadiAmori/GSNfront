<main class="login-page">
	<section class="login-card" aria-labelledby="reset-password-title">
		<h1 id="reset-password-title" class="login-title">Réinitialiser mot de passe</h1>

		<p class="reset-email" *ngIf="email">
			Compte: <strong>{{ email }}</strong>
		</p>

		<form (ngSubmit)="resetPassword()" class="login-form" autocomplete="off">
			<label class="field">
				<span class="field-label">Nouveau mot de passe</span>
				<input
					type="password"
					name="newPassword"
					[(ngModel)]="newPassword"
					placeholder="••••••••"
					required
				/>
			</label>

			<label class="field">
				<span class="field-label">Confirmer le mot de passe</span>
				<input
					type="password"
					name="confirmPassword"
					[(ngModel)]="confirmPassword"
					placeholder="••••••••"
					required
				/>
			</label>

			<div class="login-options">
				<a class="forgot-link" routerLink="/societe/login">Retour à la connexion</a>
			</div>

			<button type="submit" class="login-btn">Valider</button>
		</form>
	</section>
</main>
